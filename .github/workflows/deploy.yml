name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Build lại mỗi thứ Hai để bản chụp tài liệu chính thức không cũ quá 7 ngày.
  schedule:
    - cron: '0 2 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # `npm run build` chụp tài liệu rồi mới build. Trang tài liệu nào tải lỗi
      # chỉ làm ngăn trượt của trang đó hiện link gốc, không làm hỏng build.
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
